# Provisional thresholds for the Phase 1 sample.
# They separate the authored astronomy fixtures from the labeled reject set.
# They are not a production calibration on OpenStax or Wikipedia.
min_chars: 200
min_paragraphs: 2
min_alpha_ratio: 0.65
max_markup_ratio: 0.02
max_repeated_line_ratio: 0.35
min_language_score: 0.90
min_language_words: 20
language_function_word_denominator: 0.35
