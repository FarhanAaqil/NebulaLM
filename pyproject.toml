[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nebulalm"
version = "0.1.0"
description = "From-scratch astronomy language model. Phase 1 is a small-sample vertical slice."
requires-python = ">=3.11"
dependencies = [
  "torch==2.10.0",
  "tokenizers==0.22.2",
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
